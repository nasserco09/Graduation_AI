<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="favGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="favGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect width="64" height="64" rx="18" fill="url(#favGrad)" filter="url(#favGlow)" />
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="white" stroke-width="1.5" stroke-opacity="0.3" />

  <!-- Hanger Hook -->
  <path d="M32 16 A 4.5 4.5 0 0 1 36.5 20.5 C 36.5 23 32 24.5 32 27" fill="none" stroke="white" stroke-width="2.8" stroke-linecap="round" />
  
  <!-- Garment Base -->
  <path d="M18 35 L32 27 L46 35 C 48 36.5 47.5 38.5 45.5 38.5 L18.5 38.5 C 16.5 38.5 16 36.5 18 35 Z" fill="white" fill-opacity="0.95" />

  <!-- Optical Scan Circle / Lens -->
  <circle cx="39" cy="40" r="10" fill="#0f172a" fill-opacity="0.9" stroke="white" stroke-width="2.5" />
  <line x1="46" y1="47" x2="52" y2="53" stroke="white" stroke-width="3" stroke-linecap="round" />
  
  <!-- AI Sparkle Core -->
  <circle cx="39" cy="40" r="3" fill="url(#favGrad)" />
</svg>
