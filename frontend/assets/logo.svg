<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 56" width="240" height="56">
  <defs>
    <!-- Brand Gradients -->
    <linearGradient id="fsPrimaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    
    <linearGradient id="fsGlowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </linearGradient>

    <filter id="fsGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#6366f1" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Logo Mark Icon Box -->
  <g transform="translate(6, 4)" filter="url(#fsGlow)">
    <!-- Rounded Squircle Background -->
    <rect width="48" height="48" rx="14" fill="url(#fsPrimaryGrad)" />
    
    <!-- Subtle Inner Highlight -->
    <rect x="1.5" y="1.5" width="45" height="45" rx="12.5" fill="none" stroke="white" stroke-width="1.5" stroke-opacity="0.35" />

    <!-- Modern Hanger / Fashion Garment Silhouette -->
    <!-- Hanger Hook -->
    <path d="M24 13 A 3 3 0 0 1 27 16 C 27 18 24 19 24 21" fill="none" stroke="white" stroke-width="2.2" stroke-linecap="round" />
    <!-- Garment / Hanger Shoulder Lines -->
    <path d="M14 26.5 L24 21 L34 26.5 C 35.5 27.5 35 29 33.5 29 L14.5 29 C 13 29 12.5 27.5 14 26.5 Z" fill="white" fill-opacity="0.95" />
    
    <!-- AI Scanning Lens / Optical Ring Overlay -->
    <circle cx="29" cy="30" r="7.5" fill="#1e1b4b" fill-opacity="0.85" stroke="white" stroke-width="2" />
    <!-- Magnifier / Optical Handle -->
    <line x1="34.5" y1="35.5" x2="38.5" y2="39.5" stroke="white" stroke-width="2.2" stroke-linecap="round" />
    <!-- Sparkle inside lens -->
    <circle cx="29" cy="30" r="2.2" fill="url(#fsPrimaryGrad)" />
  </g>

  <!-- Brand Typography -->
  <g transform="translate(64, 0)">
    <!-- English Name -->
    <text x="0" y="27" font-family="'Cairo', 'Inter', system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="currentColor" letter-spacing="-0.5">Fashion<tspan fill="url(#fsPrimaryGrad)">Search</tspan></text>
    
    <!-- Arabic / Tech Tagline with Icon -->
    <g transform="translate(0, 42)">
      <circle cx="3" cy="-4" r="2.5" fill="#10b981" />
      <text x="10" y="0" font-family="'Cairo', system-ui, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="0.2">بحث بصري بالذكاء الاصطناعي</text>
    </g>
  </g>
</svg>
