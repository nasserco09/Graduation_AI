<!doctype html>
<html lang="ar" dir="rtl"><head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>حساب الإدارة | Fashion Search</title>
  <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
  <link rel="stylesheet" href="assets/vendor/fonts.css">
  <link rel="stylesheet" href="styles/admin-auth.css">
  <script src="js/admin-session.js" defer></script><script src="js/admin-auth.js" defer></script>
</head><body><main class="auth-shell">
  <a class="brand" href="/">Fashion Search <span>البحث البصري عن الأزياء</span></a>
  <section class="auth-card" aria-labelledby="account-title">
    <p class="eyebrow">حساب الأدمن</p><h1 id="account-title">إعدادات الحساب</h1>
    <p class="muted">مسجّل الدخول باسم <b id="admin-username" dir="ltr">…</b></p>
    <form id="password-form">
      <label for="current-password">كلمة المرور الحالية</label><input id="current-password" type="password" dir="ltr" autocomplete="current-password" maxlength="128" required>
      <label for="new-password">كلمة المرور الجديدة</label><input id="new-password" type="password" dir="ltr" autocomplete="new-password" minlength="15" maxlength="128" required aria-describedby="password-help">
      <p id="password-help" class="hint">من 15 إلى 128 حرفًا. تغييرها يُنهي جميع جلسات الإدارة، ثم تسجّل الدخول بالكلمة الجديدة.</p>
      <label for="new-password-confirm">تأكيد كلمة المرور الجديدة</label><input id="new-password-confirm" type="password" dir="ltr" autocomplete="new-password" minlength="15" maxlength="128" required>
      <button id="password-submit" type="submit">تغيير كلمة المرور</button>
    </form>
    <p id="account-status" role="status" aria-live="polite"></p>
    <div class="account-actions"><a href="/demo-catalog.html">العودة إلى إدارة المنتجات</a><button id="admin-logout" class="secondary" type="button">تسجيل الخروج</button></div>
  </section>
</main></body></html>
